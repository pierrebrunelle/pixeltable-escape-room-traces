# Pixeltable project configuration (https://docs.pixeltable.com).
# Entry 1 is your local database. Entry 2 is a Pixeltable Cloud database:
# replace 'pxt://<your-org>:<your-db>' with your own org and database before `pxt db update`.

[pixeltable]
psycopg_log_level = 'WARNING'

[otel]
service_name = 'escape-room-triage'
span_level = 'debug'

[openai]
rate_limits = { 'gpt-4o-mini' = 60 }

[[pixeltable.database]]
exclude = ['logs/**', '__pycache__/**', 'publish/**', 'probe_*', 'repro_*', 'scratch*', 'pipeline.py', 'make_data.py', 'data/**', 'output/**']

[[pixeltable.database]]
name = 'pxt://<your-org>:<your-db>'
cpu = 0.5
memory_mb = 1024
disk_gb = 10
workers = 1
exclude = ['.venv/**', '__pycache__/**', '*.pyc', '.git/**', 'logs/**', '.env*', 'publish/**', 'probe_*', 'repro_*', 'scratch*', 'pipeline.py', 'make_data.py', 'data/**', 'output/**']
